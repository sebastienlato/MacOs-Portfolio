<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover hands us the notch and home-indicator insets, which
         the phone shell reserves through env(safe-area-inset-*) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Sebastien Lato — Portfolio</title>
    <meta
      name="description"
      content="An interactive portfolio built as a macOS desktop. Open apps from the dock, drag windows, run commands in a real terminal, and browse projects, articles, and my resume."
    />
    <meta name="author" content="Sebastien Lato" />
    <link rel="canonical" href="https://sebastienlato.com/" />

    <link rel="icon" type="image/png" href="/macbook.png" />
    <link rel="apple-touch-icon" href="/macbook.png" />

    <!-- Matches the desktop background so mobile browser chrome blends in -->
    <meta name="theme-color" content="#1b1b3a" />

    <!-- Open Graph. Scrapers ignore relative paths, so these stay absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sebastien Lato" />
    <meta property="og:title" content="Sebastien Lato — Portfolio" />
    <meta
      property="og:description"
      content="An interactive portfolio built as a macOS desktop. Open apps from the dock, drag windows, run commands in a real terminal, and browse projects, articles, and my resume."
    />
    <meta property="og:url" content="https://sebastienlato.com/" />
    <meta property="og:image" content="https://sebastienlato.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The portfolio shown twice: a macOS desktop with a Finder window open, and the same site as an iOS Home Screen on a phone."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@SebastienLato" />
    <meta name="twitter:creator" content="@SebastienLato" />
    <meta name="twitter:title" content="Sebastien Lato — Portfolio" />
    <meta
      name="twitter:description"
      content="An interactive portfolio built as a macOS desktop. Open apps from the dock, drag windows, run commands in a real terminal, and browse projects, articles, and my resume."
    />
    <meta name="twitter:image" content="https://sebastienlato.com/og.jpg" />
    <meta
      name="twitter:image:alt"
      content="The portfolio shown twice: a macOS desktop with a Finder window open, and the same site as an iOS Home Screen on a phone."
    />

    <!--
      The boot screen's styles, inline, and its animation with them.

      Both halves are here for the same reason the markup below is. Moving the
      markup out of React got it painting before the bundle; the styles stayed
      in the stylesheet, so it still could not paint until 183KB of CSS had
      landed, and first paint went back to 2.4s as that file grew. Fifteen rules
      inline paint with the document.

      The animation matters more. It used to be a GSAP timeline, which cannot
      start until the bundle has downloaded, parsed and mounted React — so the
      2.2s of "booting" ran *after* the network instead of during it, and the
      Home Screen appeared 2.2s later than it needed to. Measured under
      Lighthouse's mobile throttling that was a Speed Index of 6.9s against a
      Largest Contentful Paint of 2.6s: four seconds where the screen was still
      changing after the content had arrived. As CSS it starts at first paint
      and runs while the bundle is still in flight.

      React's only remaining job is to take the node away; see BootScreen.tsx.
      Keep these durations and the ones there in step — 1.6 + 0.15 + 0.45.
      Colours are the resolved Tailwind values the stylesheet was producing,
      copied so the two cannot drift apart visually.
    -->
    <style>
      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 64px;
        background: #000;
        animation: boot-fade 0.45s ease 1.75s forwards;
      }

      .boot-screen img {
        width: 80px;
        filter: invert(1);
      }

      .boot-screen .progress {
        width: 208px;
        height: 6px;
        overflow: hidden;
        border-radius: 9999px;
        background: oklch(0.278 0.033 256.848);
      }

      .boot-screen .bar {
        height: 100%;
        width: 0;
        border-radius: 9999px;
        background: oklch(0.967 0.003 264.542);
        /* power1.inOut, which is what the GSAP tween used */
        animation: boot-bar 1.6s cubic-bezier(0.45, 0, 0.55, 1) forwards;
      }

      @keyframes boot-bar {
        to {
          width: 100%;
        }
      }

      /* `visibility` as well as opacity: the node is removed by React a moment
         later, and until then a transparent full-screen layer would still be
         swallowing every tap meant for the Home Screen underneath. */
      @keyframes boot-fade {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      /* Asking for less motion skips the sequence outright rather than making
         it instant — and does so before any script has run to be asked. */
      @media (prefers-reduced-motion: reduce) {
        .boot-screen {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!--
      The boot screen lives here, in the HTML, rather than being rendered by
      React — and it is the first thing painted rather than the first thing
      React paints.

      Nothing in this app exists until 130KB of JavaScript has been fetched,
      parsed and run, so the screen stayed empty until then: first paint at
      2.5s and a Speed Index to match, measured under Lighthouse's mobile
      throttling. Written into the document it paints as soon as the
      stylesheet lands — 1.4s, and a Speed Index of 1.4s with it.

      It also happens to be the honest arrangement. A Mac shows its logo
      before it has loaded anything; this one was showing it after.

      `BootScreen` in React takes this node over on mount, animates it and
      removes it. The <noscript> is the safety catch: with scripts off nothing
      would ever take it away, and it would cover the fallback page the SEO
      plugin writes below.
    -->
    <div id="boot-screen" class="boot-screen" aria-hidden="true">
      <img src="/images/logo.svg" alt="" width="80" height="98" />
      <div class="progress"><div class="bar"></div></div>
    </div>
    <noscript>
      <style>
        #boot-screen {
          display: none;
        }
      </style>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
